spring.application.name=Krate

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Subida de ficheros
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Aplicacion
app.jwt.secret=${APP_JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-bytes!!}
app.jwt.ttl-hours=${APP_JWT_TTL_HOURS:24}
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:4200,http://localhost:4300}
app.public-voting-url=${APP_PUBLIC_VOTING_URL:http://localhost:4300}
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
# Datos de prueba: si es true, en cada arranque se VACIA la base de datos y se cargan datos de ejemplo
app.seed.enabled=${APP_SEED_ENABLED:false}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
